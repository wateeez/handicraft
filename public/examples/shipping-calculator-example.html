<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Shipping Calculator - Example</title>

    <!-- Shipping Calculator Styles -->
    <link rel="stylesheet" href="../css/shipping-calculator.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            color: white;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .page-header p {
            font-size: 1.125rem;
            opacity: 0.9;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .examples-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h1>🚚 Shipping Calculator</h1>
            <p>Calculate shipping charges based on product dimensions and weight</p>
        </div>

        <div class="examples-grid">
            <!-- Example 1: Basic Form -->
            <div class="shipping-calculator">
                <h2 class="shipping-calculator-title">Calculate Shipping Cost</h2>
                <p class="shipping-calculator-subtitle">Enter product dimensions and weight to get instant shipping
                    quote</p>

                <form id="shippingForm" class="shipping-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="length">
                                Length <span class="unit">(cm)</span>
                            </label>
                            <input type="number" id="length" name="length" placeholder="30" step="0.01" min="0.01"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="width">
                                Width <span class="unit">(cm)</span>
                            </label>
                            <input type="number" id="width" name="width" placeholder="20" step="0.01" min="0.01"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="height">
                                Height <span class="unit">(cm)</span>
                            </label>
                            <input type="number" id="height" name="height" placeholder="15" step="0.01" min="0.01"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="actual_weight">
                            Actual Weight <span class="unit">(kg)</span>
                        </label>
                        <input type="number" id="actual_weight" name="actual_weight" placeholder="2.5" step="0.01"
                            min="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="shipping_method_id">
                            Shipping Method <span class="unit">(optional)</span>
                        </label>
                        <select id="shipping_method_id" name="shipping_method_id">
                            <option value="">Select shipping method...</option>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>

                    <button type="submit" class="btn-calculate">
                        Calculate Shipping
                    </button>
                </form>

                <div class="shipping-result"></div>
            </div>

            <!-- Example 2: Auto-Calculate Form -->
            <div class="shipping-calculator">
                <h2 class="shipping-calculator-title">Auto-Calculate Mode</h2>
                <p class="shipping-calculator-subtitle">Calculates automatically as you type</p>

                <form id="autoShippingForm" class="shipping-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="auto_length">
                                Length <span class="unit">(cm)</span>
                            </label>
                            <input type="number" id="auto_length" name="length" placeholder="30" step="0.01" min="0.01">
                        </div>
                        <div class="form-group">
                            <label for="auto_width">
                                Width <span class="unit">(cm)</span>
                            </label>
                            <input type="number" id="auto_width" name="width" placeholder="20" step="0.01" min="0.01">
                        </div>
                        <div class="form-group">
                            <label for="auto_height">
                                Height <span class="unit">(cm)</span>
                            </label>
                            <input type="number" id="auto_height" name="height" placeholder="15" step="0.01" min="0.01">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="auto_actual_weight">
                            Actual Weight <span class="unit">(kg)</span>
                        </label>
                        <input type="number" id="auto_actual_weight" name="actual_weight" placeholder="2.5" step="0.01"
                            min="0.01">
                    </div>

                    <button type="submit" class="btn-calculate">
                        Calculate Shipping
                    </button>
                </form>

                <div class="shipping-result" id="autoResult"></div>
            </div>
        </div>
    </div>

    <!-- Shipping Calculator JavaScript -->
    <script src="../js/shipping-calculator.js"></script>

    <script>
        // Example 1: Basic Form with Manual Submit
        const basicForm = new ShippingCalculatorForm('#shippingForm', {
            baseUrl: '/api/shipping',
            resultContainer: '#shippingForm + .shipping-result',
            autoCalculate: false
        });

        // Example 2: Auto-Calculate Form
        const autoForm = new ShippingCalculatorForm('#autoShippingForm', {
            baseUrl: '/api/shipping',
            resultContainer: '#autoResult',
            autoCalculate: true,
            debounceDelay: 800
        });

        // Load shipping methods on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const calculator = new ShippingCalculator({ baseUrl: '/api/shipping' });

            try {
                const response = await calculator.getMethods();

                if (response.success && response.data) {
                    const selects = document.querySelectorAll('[name="shipping_method_id"]');

                    selects.forEach(select => {
                        response.data.forEach(method => {
                            const option = document.createElement('option');
                            option.value = method.id;
                            option.textContent = `${method.name} - ${method.estimated_days}`;
                            select.appendChild(option);
                        });
                    });
                }
            } catch (error) {
                console.error('Failed to load shipping methods:', error);
            }
        });

        // Example 3: Programmatic Usage
        async function calculateShippingProgrammatically() {
            const calculator = new ShippingCalculator({
                baseUrl: '/api/shipping',
                onCalculate: (data) => {
                    console.log('Calculation successful:', data);
                },
                onError: (error) => {
                    console.error('Calculation failed:', error);
                },
                onLoading: (isLoading) => {
                    console.log('Loading:', isLoading);
                }
            });

            try {
                const result = await calculator.calculate({
                    length: 30,
                    width: 20,
                    height: 15,
                    actual_weight: 2.5,
                    shipping_method_id: 1
                });

                console.log('Shipping Charge:', result.data.shipping_charge);
                console.log('Weight Used:', result.data.weight_used);
                console.log('Weight Type:', result.data.weight_type);
            } catch (error) {
                console.error('Error:', error.message);
            }
        }

        // Example 4: Cart Calculation
        async function calculateCartShipping() {
            const calculator = new ShippingCalculator({ baseUrl: '/api/shipping' });

            const cartItems = [
                { length: 30, width: 20, height: 15, actual_weight: 2.5, quantity: 2 },
                { length: 10, width: 10, height: 10, actual_weight: 0.5, quantity: 1 }
            ];

            try {
                const result = await calculator.calculateCart(cartItems, 1);
                console.log('Cart Shipping:', result);
            } catch (error) {
                console.error('Cart calculation failed:', error);
            }
        }

        // Example 5: Quick Quote
        async function getQuickQuote() {
            const calculator = new ShippingCalculator({ baseUrl: '/api/shipping' });

            try {
                const result = await calculator.getQuickQuote({
                    length: 30,
                    width: 20,
                    height: 15,
                    actual_weight: 2.5
                });

                console.log('Volumetric Weight:', result.data.volumetric_weight);
                console.log('Chargeable Weight:', result.data.chargeable_weight);
                console.log('Weight Type:', result.data.weight_type);
            } catch (error) {
                console.error('Quick quote failed:', error);
            }
        }
    </script>
</body>

</html>
